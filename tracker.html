<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1114">
<title>מעקב תזונה</title>
<style>
:root{
  --bg:#0E1114; --surf:#171C21; --surf2:#1E252C; --line:#2A333B;
  --ink:#ECF1F4; --mut:#8B98A3; --pro:#7ED492; --kcal:#E4B363; --warn:#E06C5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Heebo','Assistant',system-ui,-apple-system,'Segoe UI',sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* מרווח לשעון ולאי הדינמי במצב אפליקציה במסך הבית */
.wrap{max-width:460px;margin:0 auto;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top))}
.num{font-variant-numeric:tabular-nums}
h2{font-size:19px;margin:0 0 16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
button{font-family:inherit;font-size:16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surf2);color:var(--ink);padding:12px 16px}
button:active{opacity:.7}
.solid{background:var(--pro);color:#0E1114;border-color:var(--pro);font-weight:700}
.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:6px 0}
.danger{background:transparent;color:var(--warn)}
.full{width:100%}
.flex{display:flex;gap:8px}
input,select{width:100%;padding:12px;border-radius:12px;background:var(--surf2);
  border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:16px;
  font-variant-numeric:tabular-nums}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.rail{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.rail i{display:block;height:100%;border-radius:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid>*{min-width:0}   /* בלי זה שמות ארוכים מרחיבים את העמודה מעבר למסך */
.tile{text-align:right;padding:12px;background:var(--surf);border:1px solid var(--line);
  border-radius:12px;min-width:0;overflow:hidden}
.tile b{display:block;font-size:15px;line-height:1.25;max-height:2.5em;overflow:hidden}
.tile .xs{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surf);padding:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.del{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--warn);font-size:20px;padding:0}
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:460px;width:100%;display:flex}
.tabs button{flex:1;border:none;background:none;color:var(--mut);border-radius:0;padding:16px 0;font-size:14px}
.tabs button.on{color:var(--pro);font-weight:700}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
  justify-content:center;z-index:50}
.sheet{max-width:460px;width:100%;background:var(--bg);border-top:1px solid var(--line);
  margin-top:env(safe-area-inset-top);
  border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chips button{border-radius:999px;padding:8px 14px;font-size:14px;flex:0 0 auto;color:var(--mut)}
.chips button.on{background:var(--pro);color:#0E1114;border-color:var(--pro);font-weight:700}
.toast{position:fixed;inset-inline:0;bottom:96px;display:flex;justify-content:center;z-index:60}
.toast div{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:14px}
.hide{display:none}

#print{display:none}
@media print{
  html,body{background:#fff !important;color:#000 !important}
  #app,.tabs,#sheet,#toast{display:none !important}
  #print{display:block;color:#000;background:#fff;font-size:12pt}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print .sub{color:#555;font-size:10pt;margin-bottom:14pt}
  #print table{width:100%;border-collapse:collapse;margin-bottom:14pt}
  #print th,#print td{border:1px solid #bbb;padding:5pt 7pt;text-align:right}
  #print th{background:#eee;font-weight:700}
  #print td.n{font-variant-numeric:tabular-nums}
  #print tr.tot td{font-weight:700;background:#f4f4f4}
  #print h2{font-size:13pt;margin:12pt 0 5pt;page-break-after:avoid}
  @page{margin:14mm}
}
</style>
</head>

/* ============ עזרים ============ */
const $ = (s) => document.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r0 = (n) => Math.round(n);
const uid = () => Math.random().toString(36).slice(2, 9);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const mk = (d) => d.slice(0, 7);
const shift = (s, n) => { const [y,m,d] = s.split('-').map(Number); return iso(new Date(y, m-1, d+n)); };
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function pretty(s){
  if (s === today()) return 'היום';
  if (s === shift(today(), -1)) return 'אתמול';
  const [y,m,d] = s.split('-').map(Number);
  return `יום ${DAYS[new Date(y,m-1,d).getDay()]}, ${d}.${String(m).padStart(2,'0')}`;
}

/* ============ אחסון מקומי ============ */
const K = 'ft.';
function load(key, dflt){ try { const v = localStorage.getItem(K+key); return v ? JSON.parse(v) : dflt; } catch { return dflt; } }
function save(key, val){
  try { localStorage.setItem(K+key, JSON.stringify(val)); return true; }
  catch (e) { toast('השמירה נכשלה — ייתכן שאחסון הדפדפן מלא'); return false; }
}

const S = {
  foods: load('foods', []),
  weights: load('weights', []),
  settings: load('settings', { kcalTarget: 0, proteinTarget: 0 }),
  keys: { anthropic: load('apikey', ''), gemini: load('gkey', '') },
  provider: load('provider', ''),
  logs: {},
  date: today(),
  tab: 'day',
};
/* ברירת מחדל לספק: מי שכבר שמר מפתח של Anthropic ממשיך איתו; אחרת Gemini. */
if (!S.provider) S.provider = S.keys.anthropic && !S.keys.gemini ? 'anthropic' : 'gemini';
Object.defineProperty(S, 'key', { get(){ return S.keys[S.provider] || ''; } });
const KEYSLOT = { anthropic: 'apikey', gemini: 'gkey' };
const PNAME = { anthropic: 'Claude', gemini: 'Gemini' };

function logOf(d){ const m = mk(d); if (!(m in S.logs)) S.logs[m] = load('log.'+m, []); return S.logs[m]; }
function saveLog(d){ save('log.'+mk(d), S.logs[mk(d)]); }
function entries(d){ return logOf(d).filter(e => e.date === d); }
function totals(d){ return entries(d).reduce((a,e) => ({ k: a.k+e.kcal, p: a.p+e.protein }), { k:0, p:0 }); }

let toastT;
function toast(msg){
  $('#toast').innerHTML = `<div>${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').innerHTML = '', 2400);
}

/* ============ ארוחות ============ */
const MEALS = [['breakfast','ארוחת בוקר'],['lunch','ארוחת צהריים'],
               ['dinner','ארוחת ערב'],['snack','ביניים'],['other','ללא שיוך']];
const mealName = k => (MEALS.find(m => m[0] === k) || MEALS[4])[1];
function mealNow(){
  const h = new Date().getHours();
  return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 21 ? 'dinner' : 'snack';
}
const mealOf = e => MEALS.some(m => m[0] === e.meal) ? e.meal : 'other';
function setMeal(id, meal){
  const d = S.date, e = (S.logs[mk(d)] || []).find(x => x.id === id);
  if (!e) return;
  e.meal = meal; saveLog(d);
  MEALS.forEach(([k]) => { const b = $('#m_'+k); if (b) b.className = k === meal ? 'sm on' : 'sm'; });
  render();
}

/* ============ פעולות ============ */
function addEntry({ name, qty, kcal, protein, foodId }){
  const d = S.date;
  logOf(d).push({ id: uid(), date: d, name, qty, kcal: r0(kcal), protein: r0(protein),
                  foodId: foodId || null, meal: mealNow() });
  saveLog(d);
  if (foodId){
    const f = S.foods.find(x => x.id === foodId);
    if (f){ f.uses = (f.uses || 0) + 1; save('foods', S.foods); }
  }
  render();
}
function quickAdd(f){
  const q = f.qty || 100, factor = f.unit === '100g' ? q/100 : q;
  addEntry({ name: f.name, qty: q + (f.unit === '100g' ? ' ג׳' : ' יח׳'),
             kcal: f.kcal*factor, protein: f.protein*factor, foodId: f.id });
}
/* עריכת כמות. base נשמר ברישום בפעם הראשונה, כדי שעריכות חוזרות
   יחושבו תמיד מהמקור ולא יצברו שגיאות עיגול. */
function qtyParts(e){
  const num = parseFloat(String(e.qty || '').replace(',', '.'));
  return { num: isFinite(num) ? num : 0, unit: /יח/.test(e.qty || '') ? 'יח׳' : 'ג׳' };
}
/* מאחד רישומים זהים (אותו שם, אותה ארוחה, אותה יחידה) לשורה אחת.
   base מחושב מחדש מהסכום, כך שעריכת כמות אחריו עדיין עובדת ביחס ישר.
   הפונקציה כותבת רק כשבאמת היה שינוי, ולכן אפשר לקרוא לה בכל רינדור. */
function mergeDay(d){
  const m = mk(d), arr = S.logs[m];
  if (!arr) return false;
  const seen = new Map(), out = [];
  let changed = false;
  for (const e of arr){
    if (e.date !== d){ out.push(e); continue; }
    const p = qtyParts(e);
    const key = mealOf(e) + '|' + e.name + '|' + p.unit;
    const prev = p.num ? seen.get(key) : null;
    if (prev){
      const q = qtyParts(prev).num + p.num;
      prev.qty = q + ' ' + p.unit;
      prev.kcal = r0(prev.kcal + e.kcal);
      prev.protein = r0(prev.protein + e.protein);
      prev.base = { q, k: prev.kcal, p: prev.protein };
      changed = true;
    } else {
      if (p.num) seen.set(key, e);
      out.push(e);
    }
  }
  if (changed){ S.logs[m] = out; saveLog(d); }
  return changed;
}

function sheetQty(id){
  const e = entries(S.date).find(x => x.id === id);
  if (!e) return;
  const p = qtyParts(e);
  if (!p.num) return toast('לרישום הזה אין כמות מספרית לעריכה');
  sheet('עריכת רישום', `
    <div class="sm" style="margin-bottom:12px">${esc(e.name)}</div>
    <input id="qIn" type="number" inputmode="decimal" step="any" min="0"
           value="${p.num}" style="direction:ltr">
    <div class="sm mut" style="margin:8px 0 4px">${p.unit}</div>
    <div id="qPrev" class="sm" style="margin-bottom:16px"></div>
    <div class="sm mut" style="margin-bottom:6px">שיוך לארוחה</div>
    <div class="flex" style="flex-wrap:wrap;gap:6px;margin-bottom:16px">${MEALS.map(([k, l]) =>
      `<button id="m_${k}" class="sm${mealOf(e) === k ? ' on' : ''}"
        onclick="setMeal('${e.id}','${k}')">${l}</button>`).join('')}</div>
    <button class="full solid" onclick="applyQty('${e.id}')">שמירה</button>`);
  const el = $('#qIn');
  const upd = () => {
    const b = e.base || { q: p.num, k: e.kcal, p: e.protein };
    const v = parseFloat(el.value);
    $('#qPrev').innerHTML = (isFinite(v) && v > 0 && b.q)
      ? '<b class="num" style="color:var(--kcal)">' + r0(b.k * v / b.q) + '</b> קק״ל · '
        + '<b class="num" style="color:var(--pro)">' + r0(b.p * v / b.q) + '</b> ג׳ חלבון'
      : '<span class="mut">הזן כמות</span>';
  };
  el.oninput = upd; upd(); el.focus();
}
function applyQty(id){
  const d = S.date, arr = S.logs[mk(d)] || [];
  const e = arr.find(x => x.id === id);
  if (!e) return;
  const v = parseFloat($('#qIn').value);
  if (!isFinite(v) || v <= 0) return toast('כמות לא תקינה');
  const p = qtyParts(e);
  if (!e.base) e.base = { q: p.num, k: e.kcal, p: e.protein };
  if (!e.base.q) return toast('אין כמות מקורית לחישוב');
  e.kcal = r0(e.base.k * v / e.base.q);
  e.protein = r0(e.base.p * v / e.base.q);
  e.qty = v + ' ' + p.unit;
  saveLog(d); closeSheet(); render();
}
function delEntry(id){
  const d = S.date, m = mk(d);
  S.logs[m] = S.logs[m].filter(e => e.id !== id);
  saveLog(d); render();
}
function repeatYesterday(){
  const y = entries(shift(S.date, -1));
  if (!y.length) return toast('אין רישומים מאתמול');
  y.forEach(e => logOf(S.date).push({ ...e, id: uid(), date: S.date }));
  saveLog(S.date); render();
}
/* ============ ניתוח מתכון ============
   שני מעברים: (1) קריאת המתכון מהקובץ -> רכיבים וכמויות,
   (2) התאמה לצמרת לפי אינדקס בלבד. כל החישוב נעשה כאן. */
let R = null;

function sheetRecipe(){
  if (!S.key) return sheetLabel();
  sheet('ניתוח מתכון', `
    <p class="sm mut" style="margin-bottom:12px">צילום, תמונה או PDF של מתכון.
    יחולצו הרכיבים והכמויות, יותאמו לצמרת, ויחושבו ערכים למנה אחת.</p>
    <input type="file" accept="image/*,application/pdf" onchange="analyzeRecipe(this.files[0])">
    <div id="rout" class="sm mut" style="margin-top:12px"></div>`);

/* --- פנייה למודל: Claude או Gemini, לפי S.provider ---
   כל הפרומפטים כתובים בפורמט הבלוקים של Anthropic (text / image / document);
   ל-Gemini הם מומרים ל-parts. הפונקציה מחזירה טקסט, וזורקת שגיאה בעברית. */
const CMODEL = 'claude-sonnet-5';
const GMODEL = 'gemini-3.5-flash';
const GURL = 'https://generativelanguage.googleapis.com/v1beta/models/' + GMODEL + ':generateContent';
const HOST = { anthropic: 'api.anthropic.com', gemini: 'generativelanguage.googleapis.com' };

async function askAI(content, { maxTok = 1000, json = false, system } = {}){
  const g = S.provider === 'gemini';
  let r;
  try {
    r = g ? await fetch(GURL, { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-goog-api-key': cleanKey() },
          body: JSON.stringify(geminiBody(content, maxTok, json, system)) })
      : await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-api-key': cleanKey(),
            'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify(Object.assign({ model: CMODEL, max_tokens: maxTok,
            messages: [{ role: 'user', content }] }, system ? { system } : {})) });
  } catch (netErr) {
    throw new Error('הבקשה לא יצאה לדרך (' + (netErr.name || 'שגיאה') + ': ' + (netErr.message || '') + '). '
      + 'סיבות אפשריות: חוסם תוכן בספארי, רשת שחוסמת את ' + HOST[S.provider] + ', או תמונה גדולה מדי.');
  }
  const raw = await r.text();
  if (!r.ok) throw new Error('שגיאה ' + r.status + ': ' + whyFailed(r.status, raw));
  const d = JSON.parse(raw);
  let text, cut;
  if (g){
    if (d.promptFeedback && d.promptFeedback.blockReason)
      throw new Error('הבקשה נחסמה על ידי מסנני הבטיחות של Gemini (' + d.promptFeedback.blockReason + ').');
    const c = (d.candidates || [])[0];
    if (!c) throw new Error('לא התקבלה תשובה מ-Gemini');
    text = ((c.content && c.content.parts) || []).filter(p => !p.thought && p.text).map(p => p.text).join('');
    cut = c.finishReason === 'MAX_TOKENS';
  } else {
    text = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    cut = d.stop_reason === 'max_tokens';
  }
  if (cut) throw new Error('התשובה נקטעה באמצע. נסה קלט קצר יותר, או צלם רק את החלק הרלוונטי.');
  if (!text) throw new Error('התשובה חזרה ריקה');
  return text;
}

/* ב-Gemini, טוקני ה"חשיבה" נספרים מתוך maxOutputTokens — לכן מרווח גדול.
   משלמים רק על מה שנוצר בפועל. */
function geminiBody(content, maxTok, json, system){
  const parts = typeof content === 'string' ? [{ text: content }]
    : content.map(b => b.type === 'text' ? { text: b.text }
      : { inline_data: { mime_type: b.source.media_type, data: b.source.data } });
  const body = { contents: [{ role: 'user', parts }],
    generationConfig: { maxOutputTokens: maxTok + 8000 } };
  if (json) body.generationConfig.responseMimeType = 'application/json';
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  return body;
}

function whyFailed(status, raw){
  let why = raw.slice(0, 200);
  try { why = JSON.parse(raw).error.message || why; } catch {}
  if (S.provider === 'gemini'){
    if (/API_KEY_INVALID|API key not valid/i.test(raw)) return 'המפתח נדחה. בדוק שהעתקת אותו במלואו.';
    if (status === 403) return 'למפתח אין הרשאה ל-Gemini API. ודא שיצרת אותו ב-AI Studio.';
    if (status === 429) return 'חרגת ממכסת השימוש. במסלול החינמי המכסה מתאפסת מדי יום; אפשר גם להפעיל חיוב ב-AI Studio.';
    if (status === 404) return 'המודל ' + GMODEL + ' לא נמצא — ייתכן שהוחלף בגרסה חדשה.';
  } else {
    if (status === 401) return 'המפתח נדחה. בדוק שהעתקת אותו במלואו.';
    if (status === 400 && /credit|balance/i.test(why)) return 'אין יתרה בחשבון ה-API.';
  }
  return why;
}

/* claude-sonnet-5 לא תומך ב-prefill, ולכן הנחיית הפורמט יושבת ב-system;
   ב-Gemini, responseMimeType מבטיח JSON. החילוץ מהסוגר הראשון לאחרון
   נשאר כרשת ביטחון לטקסט מקדים או לסימוני קוד. */
async function askJSON(content, maxTok){
  const body = await askAI(content, { maxTok, json: true,
    system: 'You reply with raw JSON only. No preamble, no explanation, '
      + 'no markdown code fences. Your entire response must begin with { and end with }.' });
  const clean = body.replace(/```json|```/g, '');
  const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('לא התקבל JSON תקין');
  return JSON.parse(clean.slice(a, b + 1));
}

async function fileB64(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = () => rej(new Error('לא הצלחתי לקרוא את הקובץ'));
    fr.readAsDataURL(file);
  });
}

async function analyzeRecipe(file){
  if (!file) return;
  const out = $('#rout');
  try {
    out.textContent = 'קורא את המתכון…';
    const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
    const block = isPdf
      ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: await fileB64(file) } }
      : { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await prepImage(file) } };

    const p1 = await askJSON([block, { type: 'text', text:
      'זהו מתכון. חלץ ממנו את הרכיבים והכמויות, והמר כל כמות לגרמים.\n'
      + 'כוסות, כפות ויחידות יש להמיר להערכת משקל סבירה.\n'
      + 'אם מספר המנות לא מצוין, הערך אותו לפי גודל המתכון.\n'
      + 'החזר JSON בלבד, בלי טקסט נוסף ובלי סימוני קוד:\n'
      + '{"title":"שם המתכון","servings":מספר,"ingredients":[{"name":"שם הרכיב בעברית","grams":מספר}]}' }], 3000);

    if (!p1 || !Array.isArray(p1.ingredients) || !p1.ingredients.length)
      throw new Error('לא זוהו רכיבים בקובץ');

    out.textContent = 'מתאים לצמרת…';
    const cands = p1.ingredients.map(ing => dbSearch(ing.name, 8));
    const blocks = p1.ingredients.map((ing, i) => cands[i].length
      ? `רכיב ${i}: ${ing.name}\n` + cands[i].map((c, n) => `  ${n}. ${c.row[0]}`).join('\n')
      : `רכיב ${i}: ${ing.name}\n  (אין מועמדים)`).join('\n\n');

    const p2 = await askJSON([{ type: 'text', text:
      'לכל רכיב, בחר מהרשימה שלו את הפריט הקרוב ביותר.\n'
      + 'אם אף פריט לא מתאים, החזר null עבור אותו רכיב.\n\n' + blocks
      + '\n\nהחזר JSON בלבד, בלי הסברים: {"matches":[{"ingredient":מספר,"candidateIndex":מספר או null}]}' }], 3000);

    const pick = {};
    (p2.matches || []).forEach(m => { pick[m.ingredient] = m.candidateIndex; });

    R = { title: p1.title || 'מתכון', servings: Math.max(1, parseFloat(p1.servings) || 1),
      items: p1.ingredients.map((ing, i) => {
        const ci = pick[i], c = (ci === null || ci === undefined) ? null : cands[i][ci];
        return { name: ing.name, grams: Math.max(0, parseFloat(ing.grams) || 0),
          src: c ? c.row[0] : null, k100: c ? c.row[1] : 0, p100: c ? c.row[2] : 0 };
      }) };
    drawRecipe();
  } catch (e){
    out.innerHTML = '<b style="color:var(--warn)">הניתוח נכשל.</b> ' + esc(e.message || '');
  }
}

function recipeTotals(r){
  const t = r.items.reduce((a, it) => ({
    k: a.k + it.k100 * (it.grams/100), p: a.p + it.p100 * (it.grams/100) }), { k:0, p:0 });
  const s = Math.max(1, parseFloat(r.servings) || 1);
  return { k: t.k/s, p: t.p/s, tk: t.k, tp: t.p };
}

function drawRecipe(){
  const t = recipeTotals(R);
  const miss = R.items.filter(it => !it.src).length;
  sheet('מתכון: בדיקה לפני שמירה', `
    <label class="f"><span>שם</span>
      <input value="${esc(R.title)}" oninput="R.title=this.value"></label>
    <label class="f"><span>מספר מנות</span>
      <input type="number" inputmode="decimal" min="1" style="direction:ltr"
        value="${R.servings}" oninput="R.servings=this.value;recipeLive()"></label>
    <div class="sm mut" style="margin-bottom:6px">רכיבים</div>
    <div class="list" style="margin-bottom:12px">${R.items.map((it, i) => `
      <div class="item">
        <div style="min-width:0">
          <div class="sm">${esc(it.name)}</div>
          <div class="xs mut">${it.src ? esc(it.src) : '<span style="color:var(--warn)">לא הותאם — לא נספר</span>'}</div>
        </div>
        <div class="flex" style="align-items:center">
          <input type="number" inputmode="decimal" style="width:76px;direction:ltr"
            value="${it.grams}" oninput="R.items[${i}].grams=parseFloat(this.value)||0;recipeLive()">
          <span class="xs mut">ג׳</span>
          <button class="del" onclick="R.items.splice(${i},1);drawRecipe()">×</button>
        </div>
      </div>`).join('')}</div>
    ${miss ? `<div class="card sm" style="padding:12px;border-color:var(--warn)">
      <b style="color:var(--warn)">${miss} רכיבים לא הותאמו</b>
      <div class="xs mut" style="margin-top:4px">הם לא נכללים בחישוב. אפשר למחוק אותם או להתעלם.</div></div>` : ''}
    <div class="card row" style="padding:12px;margin:12px 0">
      <span class="sm mut">למנה אחת</span>
      <span class="sm num"><b id="rp" style="color:var(--pro)">${r0(t.p)} ג׳ חלבון</b>
      <span class="mut"> · </span><span id="rk" style="color:var(--kcal)">${r0(t.k)} קק״ל</span></span></div>
    <div id="rt" class="xs mut" style="margin-bottom:12px">כל המתכון: ${r0(t.tk)} קק״ל · ${r0(t.tp)} ג׳ חלבון</div>
    <button class="full solid" onclick="saveRecipe()">שמירה כמאכל</button>
    <div id="rerr" class="sm" style="color:var(--warn);margin-top:10px"></div>`);
}
/* עדכון הסיכומים במקום, בלי לצייר את הגיליון מחדש — כדי שהשדה לא יאבד מיקוד */
function recipeLive(){
  const t = recipeTotals(R);
  $('#rp').textContent = r0(t.p) + ' ג׳ חלבון';
  $('#rk').textContent = r0(t.k) + ' קק״ל';
  $('#rt').textContent = 'כל המתכון: ' + r0(t.tk) + ' קק״ל · ' + r0(t.tp) + ' ג׳ חלבון';
}

function saveRecipe(){
  R.title = String(R.title || '').trim();
  if (!R.title){ $('#rerr').textContent = 'חסר שם למתכון.'; return; }
  const t = recipeTotals(R);
  const payload = { servings: Math.max(1, parseFloat(R.servings) || 1),
                    items: R.items.map(it => ({ ...it })) };
  if (R.id){
    Object.assign(S.foods.find(x => x.id === R.id),
      { name: R.title, kcal: r0(t.k), protein: r0(t.p), recipe: payload });
  } else {
    S.foods.push({ id: uid(), name: R.title, unit: 'unit', qty: 1,
      kcal: r0(t.k), protein: r0(t.p), uses: 0, est: 'מתכון', recipe: payload });
  }
  save('foods', S.foods); R = null; closeSheet(); render();
  toast('המתכון נשמר כמאכל');
}

function editRecipe(id){
  const f = S.foods.find(x => x.id === id);
  if (!f || !f.recipe) return;
  R = { id, title: f.name, servings: f.recipe.servings, items: f.recipe.items.map(it => ({ ...it })) };
  drawRecipe();
}

/* ============ מאכל מורכב ============
   parts הוא מקור האמת. הערכים נגזרים ממנו בכל רינדור, כך ששינוי כמות
   של רכיב מתעדכן מיד בכל המאכלים המורכבים שמכילים אותו.
   רישומים שכבר נשמרו ביומן שומרים עותק משלהם ולא משתנים למפרע. */
function partVals(p){
  const f = S.foods.find(x => x.id === p.foodId);
  if (!f || f.parts) return { k:0, p:0, name:'(רכיב חסר)', unit:'ג׳' };
  const q = parseFloat(p.qty) || 0;
  const fac = f.unit === '100g' ? q/100 : q;
  return { k: f.kcal*fac, p: f.protein*fac, name: f.name,
           unit: f.unit === '100g' ? 'ג׳' : 'יח׳' };
}
function compTotals(f){
  return (f.parts || []).reduce((a, p) => {
    const v = partVals(p); return { k: a.k + v.k, p: a.p + v.p };
  }, { k:0, p:0 });
}
function recalcComposites(){
  let changed = false;
  S.foods.forEach(f => {
    if (!f.parts) return;
    const t = compTotals(f);
    if (f.kcal !== r0(t.k) || f.protein !== r0(t.p) || f.unit !== 'unit' || f.qty !== 1){
      f.kcal = r0(t.k); f.protein = r0(t.p); f.unit = 'unit'; f.qty = 1;
      changed = true;
    }
  });
  if (changed) save('foods', S.foods);
}

function toggleSel(id){
  S.sel = S.sel || [];
  const i = S.sel.indexOf(id);
  if (i > -1) S.sel.splice(i, 1);
  else if (S.sel.length < 5) S.sel.push(id);
  else return toast('אפשר לאחד עד 5 פריטים');
  render();
}
function startCompose(){
  const picked = (S.sel || []).map(id => S.foods.find(x => x.id === id)).filter(Boolean);
  if (picked.length < 2) return toast('בחר לפחות שני פריטים');
  D = { name: picked.map(f => f.name.split(',')[0].trim()).join(' עם '),
        parts: picked.map(f => ({ foodId: f.id, qty: f.qty })) };
  drawCompose();
}
function editCompose(id){
  const f = S.foods.find(x => x.id === id);
  if (!f) return;
  D = { id, name: f.name, parts: f.parts.map(p => ({ ...p })) };
  drawCompose();
}
function drawCompose(){
  const t = compTotals(D);
  sheet(D.id ? 'עריכת מאכל מורכב' : 'מאכל מורכב חדש', `
    <label class="f"><span>שם</span>
      <input value="${esc(D.name||'')}" oninput="D.name=this.value"></label>
    <div class="sm mut" style="margin-bottom:6px">מרכיבים</div>
    <div class="list" style="margin-bottom:12px">${D.parts.map((p, i) => {
      const v = partVals(p);
      return `<div class="item">
        <div style="min-width:0"><div class="sm">${esc(v.name)}</div>
          <div id="cp${i}" class="xs mut num">${r0(v.k)} קק״ל · ${r0(v.p)} ג׳ חלבון</div></div>
        <div class="flex" style="align-items:center">
          <input type="number" inputmode="decimal" style="width:78px;direction:ltr"
                 value="${p.qty}" oninput="D.parts[${i}].qty=this.value;composeLive()">
          <span class="xs mut">${v.unit}</span>
          <button class="del" onclick="D.parts.splice(${i},1);drawCompose()">×</button>
        </div></div>`;
    }).join('')}</div>
    <div class="card row" style="padding:12px;margin-bottom:12px"><span class="sm mut">סה״כ למנה</span>
      <span class="sm num"><b id="ctp" style="color:var(--pro)">${r0(t.p)} ג׳ חלבון</b>
      <span class="mut"> · </span><span id="ctk" style="color:var(--kcal)">${r0(t.k)} קק״ל</span></span></div>
    ${S.key ? `<button class="full sm" style="margin-bottom:12px" onclick="aiName()">✨ הצע שם</button>
      <div id="anout" class="sm mut" style="margin-bottom:12px"></div>` : ''}
    <div class="flex">
      <button class="solid" style="flex:1" onclick="saveCompose()">שמירה</button>
      ${D.id ? '<button class="danger" onclick="delCompose()">מחיקה</button>' : ''}
    </div>
    <div id="cerr" class="sm" style="color:var(--warn);margin-top:10px"></div>`);
}
function composeLive(){
  D.parts.forEach((p, i) => { const v = partVals(p), n = $('#cp' + i);
    if (n) n.textContent = r0(v.k) + ' קק״ל · ' + r0(v.p) + ' ג׳ חלבון'; });
  const t = compTotals(D);
  $('#ctp').textContent = r0(t.p) + ' ג׳ חלבון';
  $('#ctk').textContent = r0(t.k) + ' קק״ל';
}
async function aiName(){
  const out = $('#anout');
  out.textContent = 'חושב…';
  const items = D.parts.map(p => { const v = partVals(p); return v.name + ' ' + p.qty + ' ' + v.unit; });
  try {
    const name = (await askAI('תן שם קצר וטבעי בעברית למנה שמורכבת מ: ' + items.join(', ')
      + '\nהחזר את השם בלבד, בלי מרכאות ובלי הסבר.', { maxTok: 100 })).trim();
    if (name){ D.name = name; drawCompose(); }
  } catch (e){ out.innerHTML = '<b style="color:var(--warn)">לא הצלחתי.</b> ' + esc(e.message || ''); }
}
function saveCompose(){
  const parts = D.parts.filter(p => (parseFloat(p.qty) || 0) > 0)
                       .map(p => ({ foodId: p.foodId, qty: parseFloat(p.qty) }));
  D.name = String(D.name || '').trim();
  if (!D.name) return void ($('#cerr').textContent = 'חסר שם למאכל.');
  if (!parts.length) return void ($('#cerr').textContent = 'אין מרכיבים עם כמות.');
  if (D.id){
    Object.assign(S.foods.find(x => x.id === D.id), { name: D.name, parts });
  } else {
    S.foods.push({ id: uid(), name: D.name, parts, unit: 'unit', qty: 1,
                   kcal: 0, protein: 0, uses: 0 });
  }
  save('foods', S.foods); recalcComposites();
  S.sel = []; closeSheet(); render();
}
function delCompose(){
  S.foods = S.foods.filter(x => x.id !== D.id);
  save('foods', S.foods); closeSheet(); render();
}

/* סינון בצד הלקוח, בלי render מחדש — כדי שהמיקוד בשדה החיפוש לא יאבד בהקלדה */
function filterFoods(){
  const q = ($('#fq').value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('#foodlist .item');
  let shown = 0;
  rows.forEach(r => {
    const hit = !q || (r.dataset.n || '').includes(q);
    r.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const nr = $('#nores');
  if (nr) nr.style.display = (q && !shown) ? '' : 'none';
  const fl = $('#foodlist');
  if (fl) fl.style.display = shown ? '' : 'none';
}

/* ============ מסך: סיכומים ============ */
function viewSum(){
  const all = Object.keys(localStorage).filter(k => k.startsWith(K+'log.'))
    .flatMap(k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return []; } });
  const stat = (from, to) => {
    const byDay = {};
    all.filter(e => e.date >= from && e.date <= to).forEach(e => {
      byDay[e.date] = byDay[e.date] || { k:0, p:0 };
      byDay[e.date].k += e.kcal; byDay[e.date].p += e.protein;
    });
    const days = Object.keys(byDay), n = days.length;
    const sum = days.reduce((a,d) => ({ k: a.k+byDay[d].k, p: a.p+byDay[d].p }), { k:0, p:0 });
    const span = Math.round((new Date(to) - new Date(from))/864e5) + 1;
    const ws = S.weights.filter(x => x.date >= from && x.date <= to).sort((a,b) => a.date < b.date ? -1 : 1);
    return { n, span, k: n ? sum.k/n : 0, p: n ? sum.p/n : 0,
      hit: S.settings.proteinTarget ? days.filter(d => byDay[d].p >= S.settings.proteinTarget).length : null,
      dw: ws.length > 1 ? ws[ws.length-1].kg - ws[0].kg : null };
  };
  const box = (title, s) => `<div class="card">
    <div class="row" style="margin-bottom:14px"><b>${title}</b>
      <span class="xs mut num">${s.n} מתוך ${s.span} ימים נרשמו</span></div>
    ${s.n ? `<div class="grid" style="gap:14px">
      <div><div class="xs mut">חלבון ליום</div>
        <div class="num" style="color:var(--pro);font-size:28px;font-weight:800">${r0(s.p)}</div></div>
      <div><div class="xs mut">קלוריות ליום</div>
        <div class="num" style="color:var(--kcal);font-size:28px;font-weight:800">${r0(s.k)}</div></div>
      ${s.hit !== null ? `<div><div class="xs mut">ימים ביעד החלבון</div>
        <div class="num" style="font-size:20px">${s.hit} / ${s.n}</div></div>` : ''}
      ${s.dw !== null ? `<div><div class="xs mut">שינוי במשקל</div>
        <div class="num" style="font-size:20px">${s.dw > 0 ? '+' : ''}${s.dw.toFixed(1)} ק״ג</div></div>` : ''}
    </div>${s.n < s.span ? '<div class="xs mut" style="margin-top:14px">הממוצעים מחושבים על הימים שנרשמו בלבד.</div>' : ''}`
    : '<div class="sm mut">אין רישומים בתקופה הזו.</div>'}</div>`;
  const t = today();
  return `<h2>סיכומים</h2>
    ${box('שבעת הימים האחרונים', stat(shift(t,-6), t))}
    ${box('החודש הנוכחי', stat(t.slice(0,8)+'01', t))}
    <div class="flex" style="margin-bottom:8px">
      <button style="flex:1" onclick="exportAll()">ייצוא גיבוי</button>
      <button style="flex:1" onclick="sheetImport()">שחזור מגיבוי</button>
    </div>
    <button class="full" style="margin-bottom:8px" onclick="printWeek()">דו״ח שבועי להדפסה / PDF</button>
    <p class="xs mut">הנתונים נשמרים במכשיר הזה בלבד, וספארי מוחק אותם אחרי שבוע ללא כניסה לאתר.
    כדאי לייצא גיבוי מדי פעם, ולהוסיף את הכלי למסך הבית — שם המחיקה לא חלה.</p>`;
}
function exportAll(){
  const logs = {};
  Object.keys(localStorage).filter(k => k.startsWith(K+'log.'))
    .forEach(k => logs[k.slice(K.length+4)] = JSON.parse(localStorage.getItem(k)));
  const blob = new Blob([JSON.stringify({ foods: S.foods, logs, weights: S.weights,
    settings: S.settings, exported: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  shareFile(new File([blob], `food-tracker-${today()}.json`, { type: 'application/json' }), 'גיבוי מעקב תזונה');
}

/* דו”ח שבועי. משתמש במנגנון ההדפסה של הדפדפן:
   באייפון, שיתוף > הדפסה > שמירה לקבצים מייצרת PDF עם עברית תקינה. */
function weekData(){
  const to = S.date, from = shift(to, -6);
  const st = S.settings;
  const days = [];
  for (let i = 0; i < 7; i++){
    const d = shift(from, i), es = entries(d);
    const t = es.reduce((a,e) => ({ k: a.k+e.kcal, p: a.p+e.protein }), { k:0, p:0 });
    days.push({ d, es, ...t });
  }
  const logged = days.filter(x => x.es.length);
  const avg = k => logged.length ? r0(logged.reduce((a,x) => a+x[k], 0)/logged.length) : 0;
  const wRow = S.weights.filter(x => x.date >= from && x.date <= to)
                        .sort((a,b) => a.date < b.date ? -1 : 1);

  return { to, from, st, days, logged, avg, wRow };
}

/* באייפון, ממסך הבית אין לדף גישה למנגנון ההדפסה — window.print() פשוט לא עושה כלום.
   לכן שם נבנה קובץ PDF בקוד ונמסר דרך גיליון השיתוף. בספארי רגיל נשארת ההדפסה,
   שמפיקה PDF עם טקסט אמיתי. */
const STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
function printWeek(){
  const W = weekData();
  if (STANDALONE) return pdfWeek(W);
  const { to, from, st, days, logged, avg, wRow } = W;
  const byMeal = es => MEALS.map(([k, label]) => {
    const l = es.filter(e => mealOf(e) === k);
    if (!l.length) return '';
    return `<tr><td colspan="3" style="background:#fafafa"><i>${label}</i></td></tr>`
      + l.map(e => `<tr><td>${esc(e.name)} <span style="color:#666">${esc(e.qty||'')}</span></td>
          <td class="n">${e.kcal}</td><td class="n">${e.protein}</td></tr>`).join('');
  }).join('');

  $('#print').innerHTML = `
    <h1>דו״ח תזונה שבועי</h1>
    <div class="sub">${from} — ${to} · ${logged.length} ימים נרשמו · הופק ${today()}</div>
    <table>
      <tr><th>יום</th><th>קלוריות</th><th>חלבון (ג׳)</th></tr>
      ${days.map(x => `<tr><td>${x.d}</td>
        <td class="n">${x.es.length ? r0(x.k) : '—'}</td>
        <td class="n">${x.es.length ? r0(x.p) : '—'}</td></tr>`).join('')}
      <tr class="tot"><td>ממוצע יומי</td><td class="n">${avg('k')}</td><td class="n">${avg('p')}</td></tr>
      ${st.kcalTarget || st.proteinTarget ? `<tr><td>יעד</td>
        <td class="n">${st.kcalTarget || '—'}</td><td class="n">${st.proteinTarget || '—'}</td></tr>` : ''}
    </table>
    ${wRow.length ? `<h2>משקל</h2><table>
      <tr><th>תאריך</th><th>ק״ג</th></tr>
      ${wRow.map(w => `<tr><td>${w.date}</td><td class="n">${w.kg}</td></tr>`).join('')}
    </table>` : ''}
    <h2>פירוט יומי</h2>
    ${days.filter(x => x.es.length).map(x => `
      <h2>${x.d} — ${r0(x.k)} קק״ל · ${r0(x.p)} ג׳ חלבון</h2>
      <table><tr><th>פריט</th><th>קק״ל</th><th>חלבון</th></tr>${byMeal(x.es)}</table>`).join('')}`;
  closeSheet();
  setTimeout(() => window.print(), 120);
}

/* --- PDF בלי ספריות: כל עמוד מצויר על canvas ונשמר כ-JPEG בתוך קובץ PDF מינימלי.
   העברית מצוירת בגופן המערכת, כך שהיא תקינה; המחיר — הטקסט ב-PDF הוא תמונה
   (אי אפשר לסמן או לחפש בו). הכול סינכרוני, כדי שהשיתוף יישאר בתוך הלחיצה. */
function pdfWeek(W){
  const PW = 1240, PH = 1754, M = 90, R = PW - M;
  const CN = M + 330, CK = M + 235, CP = M + 85;          // גבול עמודת השם, מרכזי עמודות המספרים
  const FONT = '-apple-system, "Segoe UI", Arial, sans-serif';
  const pages = [];
  let c, x, y;
  const page = () => {
    c = document.createElement('canvas'); c.width = PW; c.height = PH;
    x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, PW, PH);
    x.direction = 'rtl'; x.textBaseline = 'middle';
    pages.push(c); y = M;
  };
  const need = h => { if (y + h > PH - M) page(); };
  const txt = (t, px, py, { size = 26, bold = false, color = '#000', align = 'right', italic = false } = {}) => {
    x.font = (italic ? 'italic ' : '') + (bold ? '700 ' : '') + size + 'px ' + FONT;
    x.fillStyle = color; x.textAlign = align; x.fillText(t, px, py);
  };
  const fit = (t, max) => {
    x.font = '26px ' + FONT;
    if (x.measureText(t).width <= max) return t;
    while (t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1);
    return t + '…';
  };
  const row = (cells, { bold = false, fill = null, italic = false, color = '#000' } = {}) => {
    const h = 46; need(h);
    if (fill){ x.fillStyle = fill; x.fillRect(M, y, R - M, h); }
    const my = y + h / 2;
    txt(fit(String(cells[0]), R - CN - 16), R - 10, my, { bold, italic, color });
    if (cells[1] != null) txt(String(cells[1]), CK, my, { bold, align: 'center' });
    if (cells[2] != null) txt(String(cells[2]), CP, my, { bold, align: 'center' });
    x.strokeStyle = '#ccc'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(M, y + h); x.lineTo(R, y + h); x.stroke();
    y += h;
  };
  const head = cells => row(cells, { bold: true, fill: '#eeeeee' });
  const h2 = t => { need(30 + 56 + 46 * 2); y += 30; txt(t, R, y + 20, { size: 32, bold: true }); y += 56; };

  const { to, from, st, days, logged, avg, wRow } = W;
  page();
  txt('דו״ח תזונה שבועי', R, y + 24, { size: 46, bold: true }); y += 70;
  txt(from + ' — ' + to + ' · ' + (logged.length === 1 ? 'יום אחד נרשם' : logged.length + ' ימים נרשמו') + ' · הופק ' + today(), R, y + 14,
      { size: 24, color: '#555' }); y += 56;
  head(['יום', 'קלוריות', 'חלבון (ג׳)']);
  days.forEach(d => row([d.d, d.es.length ? r0(d.k) : '—', d.es.length ? r0(d.p) : '—']));
  row(['ממוצע יומי', avg('k'), avg('p')], { bold: true, fill: '#f4f4f4' });
  if (st.kcalTarget || st.proteinTarget) row(['יעד', st.kcalTarget || '—', st.proteinTarget || '—']);
  if (wRow.length){
    h2('משקל'); head(['תאריך', 'ק״ג', null]);
    wRow.forEach(w => row([w.date, w.kg, null]));
  }
  const withData = days.filter(d => d.es.length);
  if (withData.length){ h2('פירוט יומי'); y -= 20; }
  withData.forEach(d => {
    h2(d.d + ' — ' + r0(d.k) + ' קק״ל · ' + r0(d.p) + ' ג׳ חלבון');
    head(['פריט', 'קק״ל', 'חלבון']);
    MEALS.forEach(([k, label]) => {
      const l = d.es.filter(e => mealOf(e) === k);
      if (!l.length) return;
      row([label], { italic: true, fill: '#fafafa', color: '#555' });
      l.forEach(e => row([e.name + (e.qty ? ' · ' + e.qty : ''), e.kcal, e.protein]));
    });
  });
  pages.forEach((pg, i) => {
    x = pg.getContext('2d');
    txt('עמוד ' + (i + 1) + ' מתוך ' + pages.length, PW / 2, PH - M / 2, { size: 20, color: '#888', align: 'center' });
  });

  const blob = pdfFromJpegs(pages.map(pg => {
    const b64 = pg.toDataURL('image/jpeg', 0.88).split(',')[1], bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return { bytes: u, w: pg.width, h: pg.height };
  }));
  closeSheet();
  shareFile(new File([blob], 'food-report-' + to + '.pdf', { type: 'application/pdf' }), 'דו״ח תזונה שבועי');
}

/* כותב PDF 1.4: קטלוג, עץ עמודים, ולכל עמוד — תמונת JPEG אחת במלוא גודל A4. */
function pdfFromJpegs(imgs){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const put = v => { const b = typeof v === 'string' ? enc.encode(v) : v; parts.push(b); len += b.length; };
  const obj = (n, ...body) => { offs[n] = len; put(n + ' 0 obj\n'); body.forEach(put); put('\nendobj\n'); };
  const A4 = '0 0 595.28 841.89', n = imgs.length;
  put('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + n + ' /Kids [' + imgs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ') + '] >>');
  imgs.forEach((im, i) => {
    const p = 3 + 3 * i, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [' + A4 + '] /Resources << /XObject << /Im0 '
      + (p + 2) + ' 0 R >> >> /Contents ' + (p + 1) + ' 0 R >>');
    obj(p + 1, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
    obj(p + 2, '<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h
      + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length
      + ' >>\nstream\n', im.bytes, '\nendstream');
  });
  const total = 2 + 3 * n, xref = len;
  put('xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n');
  for (let i = 1; i <= total; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  put('trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}

/* ממסך הבית, קישור הורדה לא מוביל לשום מקום — הקובץ נמסר דרך גיליון השיתוף
   (משם: שמירה בקבצים, הדפסה, וואטסאפ). בדפדפן רגיל — הורדה כרגיל. */
function shareFile(file, title){
  if (STANDALONE && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title }).catch(e => {
      if (e.name !== 'AbortError') toast('השיתוף נכשל: ' + (e.message || e.name));
    });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function importAll(file){
  if (!file) return;
  const out = $('#imp');
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || typeof d.logs !== 'object') throw new Error('הקובץ אינו גיבוי של הכלי');
    const days = Object.values(d.logs).reduce((a, v) => a + (Array.isArray(v) ? v.length : 0), 0);
    Object.keys(localStorage).filter(k => k.startsWith(K) && !['apikey', 'gkey', 'provider'].includes(k.slice(K.length)))
      .forEach(k => localStorage.removeItem(k));
    save('foods', Array.isArray(d.foods) ? d.foods : []);
    save('weights', Array.isArray(d.weights) ? d.weights : []);
    save('settings', d.settings || { kcalTarget: 0, proteinTarget: 0 });
    Object.entries(d.logs).forEach(([m, v]) => { if (Array.isArray(v)) save('log.' + m, v); });
    out.textContent = 'שוחזרו ' + days + ' רישומים. טוען מחדש…';
    setTimeout(() => location.reload(), 800);
  } catch (e){
    out.innerHTML = '<b style="color:var(--warn)">השחזור נכשל.</b> ' + esc(e.message || '');
  }
}

/* באג קודם: מצב disabled של כפתור השמירה חושב רק בציור הטופס, וההקלדה
   לא עדכנה אותו — כך שבהוספה ידנית (שם ריק בפתיחה) הכפתור נשאר נעול תמיד.
   עכשיו הכפתור תמיד פעיל, והבדיקה נעשית בלחיצה עם הסבר מה חסר. */
function saveFood(alsoLog){
  const qty = parseFloat(D.qty)||0, kcal = parseFloat(D.kcal)||0, protein = parseFloat(D.protein)||0;
  D.name = String(D.name || '').trim();
  const miss = [!D.name && 'שם', !(qty > 0) && (D.unit === '100g' ? 'גודל המנה בגרמים' : 'מספר היחידות')].filter(Boolean);
  if (miss.length){ $('#ferr').textContent = 'חסר: ' + miss.join(' ו') + '.'; return; }
  const factor = D.unit === '100g' ? qty/100 : qty;
  if (D.id){
    Object.assign(S.foods.find(x => x.id === D.id), { name: D.name, unit: D.unit, kcal, protein, qty });
    save('foods', S.foods); closeSheet(); render(); return;
  }
  let fid = null;
  if (D.keep){
    fid = uid();
    addFood({ id: fid, name: D.name, unit: D.unit, kcal, protein, qty, uses: 0,
              est: D.fromAI ? (D.aiSource || true) : undefined });
  }
  if (alsoLog){
    addEntry({ name: D.name, qty: qty + (D.unit === '100g' ? ' ג׳' : ' יח׳'),
               kcal: kcal*factor, protein: protein*factor, foodId: fid });
  } else { toast(D.name + ' נשמר'); render(); }
  closeSheet();
}
function delFood(){
  S.foods = S.foods.filter(x => x.id !== D.id);
  save('foods', S.foods); closeSheet(); render();
}

/* ============ מילוי אוטומטי מצמרת ============
   חלוקת התפקידים: צמרת = הנתונים, Claude = בחירת פריט והערכת משקל,
   האפליקציה = החישוב. Claude לא מחזיר ולו מספר תזונתי אחד — רק אינדקס
   מתוך הרשימה שנשלחה אליו, ומשקל בגרמים. */
function dbSearch(q, n){
  const toks = String(q).toLowerCase().split(/[\s,]+/).filter(t => t.length > 1);
  if (!toks.length) return [];
  return DB.map((row, i) => {
    const name = row[0].toLowerCase();
    let sc = 0;
    toks.forEach(t => { if (name.includes(t)) sc += t.length; });
    if (sc && name.startsWith(toks[0])) sc += 3;
    return { i, row, sc };
  }).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).slice(0, n);
}

async function aiEstimate(qArg){
  const q = String(qArg !== undefined ? qArg : (($('#aiq') || {}).value || '')).trim();
  const out = $('#aiout');
  if (!q) return;
  if (!S.key) return sheetLabel();
  const cands = dbSearch(q, 18);
  if (!cands.length){
    out.innerHTML = '<b style="color:var(--warn)">לא נמצאו התאמות במאגר.</b> נסה ניסוח אחר או הוסף ידנית.';
    return;
  }
  out.textContent = 'מחפש התאמה…';
  const list = cands.map((c, n) =>
    `${n}. ${c.row[0]} | ${c.row[1]} קק״ל ו-${c.row[2]} ג׳ חלבון ל-100 ג׳ | מנה רגילה ${c.row[4]} ג׳`).join('\n');
  const prompt = 'המשתמש תיאר מאכל. בחר מהרשימה את הפריט הקרוב ביותר והערך את המשקל בגרמים.\n'
    + 'התיאור: ' + q + '\n\nהרשימה:\n' + list
    + '\n\nהשתמש ב"מנה רגילה" כעוגן למשקל, והתאם אותו אם התיאור מרמז על גודל אחר.\n'
    + 'אם שום פריט לא מתאים, החזר candidateIndex: null.\n'
    + 'החזר JSON בלבד, בלי טקסט נוסף ובלי סימוני קוד:\n'
    + '{"candidateIndex": מספר או null, "grams": מספר, "name": "שם קצר בעברית למאכל", "note": "משפט קצר על אופן ההערכה"}';
  try {
    const j = await askJSON(prompt, 400);

    if (j.candidateIndex === null || j.candidateIndex === undefined)
      throw new Error('לא נמצאה התאמה מתאימה. ' + esc(j.note || ''));
    const c = cands[j.candidateIndex];
    if (!c) throw new Error('התקבל אינדקס לא חוקי');
    const g = parseFloat(j.grams);
    if (!isFinite(g) || g <= 0) throw new Error('התקבל משקל לא חוקי');

    out.textContent = '';
    sheetFood(null, { name: j.name || c.row[0], unit: '100g',
      kcal: c.row[1], protein: c.row[2], qty: Math.round(g),
      fromAI: true, aiSource: c.row[0], aiNote: j.note || '' });
  } catch (e){
    out.innerHTML = '<b style="color:var(--warn)">ההערכה נכשלה.</b> ' + esc(e.message || '');
  }
}

/* --- צילום תווית --- */
const BUILD = '2026-09-25a';

/* מפתח שהועתק מטקסט עברי עלול לכלול סימני כיווניות בלתי־נראים (U+200E/200F).
   ערך כזה בכותרת HTTP גורם ל-fetch לזרוק TypeError מיידית, בלי שום פנייה לרשת. */
/* חילוץ המפתח מתוך ההדבקה, בשני שלבים:
   1. התאמה על המחרוזת הגולמית — רווח או שורה חדשה משמשים כגבול טבעי.
   2. הסרת סיומת גרסה שנצמדה בלי רווח (ספרות ומקפים הם חלק מתווי המפתח,
      ולכן שלב 1 לבדו בולע אותה). */
const KEYLEN = { anthropic: 108, gemini: 39 };
function cleanKey(src, prov){
  prov = prov || S.provider;
  const raw = String(src === undefined ? (S.keys[prov] || '') : src);
  if (prov === 'gemini'){
    /* מפתח Gemini הוא AIza ועוד 35 תווים — לוקחים בדיוק אותו */
    const m = raw.match(/AIza[0-9A-Za-z_-]{35}/);
    return m ? m[0] : raw.replace(/[^\x21-\x7E]/g, '').replace(/^["'`]+|["'`]+$/g, '');
  }
  const m = raw.match(/sk-ant-[A-Za-z0-9_-]+/);
  let v = m ? m[0]
            : raw.replace(/[^\x21-\x7E]/g, '').replace(/^["'`]+|["'`]+$/g, '');
  const junk = /(?:[?&]\w+=)?\d{4}-\d{2}-\d{2}[a-z]?$/;
  for (let i = 0; i < 5 && junk.test(v); i++) v = v.replace(junk, '');
  /* גיזום אחרון לאורך הידוע. פועל רק על מפתח ארוך מדי, ותמיד מדווח. */
  if (/^sk-ant-api03-/.test(v) && v.length > KEYLEN.anthropic) v = v.slice(0, KEYLEN.anthropic);
  return v;
}

/* בדיקה מינימלית: טקסט בלבד, בלי תמונה. מבודדת רשת/CORS מטיפול בתמונה. */
async function testApi(){
  const out = $('#lbl');
  const raw = S.key || '', k = cleanKey();
  const stripped = raw.length - k.length;
  const note = 'מפתח: ' + k.length + ' תווים'
    + (stripped ? ' · הוסרו ' + stripped + ' תווים בלתי־חוקיים' : ' · נקי')
    + '<br><span style="direction:ltr;display:inline-block">'
    + esc(k.slice(0, 13)) + ' … ' + esc(k.slice(-12)) + '</span><br>';
  out.innerHTML = note + 'בודק…';
  const t0 = Date.now();
  try {
    const r = S.provider === 'gemini'
      ? await fetch(GURL, { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-goog-api-key': cleanKey() },
          body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'hi' }] }],
            generationConfig: { maxOutputTokens: 200 } }) })
      : await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
          headers: { 'content-type': 'application/json', 'x-api-key': cleanKey(),
            'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: CMODEL, max_tokens: 4,
            messages: [{ role: 'user', content: 'hi' }] }) });
    const body = (await r.text()).slice(0, 300);
    out.innerHTML = note + '<b>הבקשה הגיעה לשרת.</b><br>status ' + r.status
      + ' · ' + (Date.now() - t0) + 'ms<br><span style="direction:ltr;display:inline-block">'
      + esc(body) + '</span>';
  } catch (e){
    out.innerHTML = note + '<b style="color:var(--warn)">הבקשה לא יצאה מהדפדפן.</b><br>'
      + esc((e.name || '') + ': ' + (e.message || '')) + '<br>'
      + (Date.now() - t0) + 'ms · origin: ' + esc(location.origin || 'null')
      + '<br>' + PNAME[S.provider] + ' · build ' + BUILD;
  }
}

function sheetLabel(){
  sheet('צילום תווית', `
    <p class="sm mut">צלם את טבלת הערכים התזונתיים, לא את חזית האריזה.
      הערכים ייפתחו לבדיקה לפני השמירה.</p>
    <div class="flex" style="margin-bottom:12px">
      ${['gemini', 'anthropic'].map(p => `<button class="${S.provider === p ? 'solid' : 'ghost'} sm" style="flex:1"
        onclick="setProvider('${p}')">${PNAME[p]}${S.keys[p] ? '' : ' · אין מפתח'}</button>`).join('')}
    </div>
    ${S.key ? '' : `<label class="f"><span>מפתח API של ${PNAME[S.provider]} (נשמר במכשיר בלבד)</span>
      <input id="ak" placeholder="${S.provider === 'gemini' ? 'AIza...' : 'sk-ant-...'}" style="direction:ltr" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></label>
      <div id="akerr" class="sm" style="margin-bottom:12px"></div>
      <button class="full" style="margin-bottom:16px" onclick="saveKey()">שמירת המפתח</button>`}
    <input id="pic" type="file" accept="image/*" capture="environment" class="hide" onchange="readLabel(this.files[0])">
    <button class="solid full" ${S.key ? '' : 'disabled'} onclick="document.getElementById('pic').click()">
      ${S.key ? 'צילום או בחירת תמונה' : 'נדרש מפתח API'}</button>
    <div id="lbl" class="sm mut" style="margin-top:12px"></div>
    ${S.key ? `<button class="ghost sm" style="margin-top:12px" onclick="showKey()">הצגת המפתח השמור</button>
      <button class="ghost sm" style="margin-top:12px" onclick="testApi()">בדיקת חיבור ל-API</button>
      <button class="ghost sm" style="margin-top:12px" onclick="resetKey()">החלפת מפתח ה-API</button>` : ''}
    <p class="xs mut" style="margin-top:16px;direction:ltr;text-align:left">build ${BUILD}</p>`);
}
function setProvider(p){
  S.provider = p; save('provider', p); sheetLabel();
}
function saveKey(){
  const typed = $('#ak').value || '';
  const v = cleanKey(typed);
  if (!v) return;
  const g = S.provider === 'gemini';
  const bad = g ? (!/^AIza/.test(v) ? 'מפתח של Gemini מתחיל ב-AIza' : '')
                : (!/^sk-ant-/.test(v) ? 'מפתח של Claude מתחיל ב-sk-ant-' : '');
  if (bad){
    $('#akerr').innerHTML = '<b style="color:var(--warn)">לא נשמר.</b> ' + esc(bad)
      + '<br>העתק מ-' + (g ? 'aistudio.google.com' : 'console.anthropic.com')
      + ' בכפתור ההעתקה, לא בסימון הטקסט.';
    return;
  }
  S.keys[S.provider] = v; save(KEYSLOT[S.provider], v);
  const cut = typed.trim().length - v.length, len = KEYLEN[S.provider];
  sheetLabel();
  if (cut > 0) $('#lbl').innerHTML = 'נשמר. הוסרו ' + cut + ' תווים מיותרים. '
    + 'אורך סופי: ' + v.length + (v.length === len ? ' — תקין.' : ' — חריג!');
}
/* תמונה מהאייפון היא 12MP ולעיתים HEIC — שולחים JPEG מוקטן.
   בקשה גדולה מדי נחתכת לפני שהשרת עונה, והדפדפן מדווח על כך כ-TypeError. */
async function prepImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('לא הצלחתי לפתוח את התמונה'));
      i.src = url;
    });
    const MAX = 1400;
    const s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s);
    c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function readLabel(file){
  if (!file) return;
  const out = $('#lbl');
  out.textContent = 'קורא את התווית…';
  let stage = 'הכנת התמונה';
  try {
    const b64 = await prepImage(file);
    if (b64.length > 4.5e6) throw new Error('התמונה גדולה מדי גם אחרי הקטנה. צלם קרוב יותר לטבלה בלבד.');

    stage = 'פנייה ל-' + PNAME[S.provider];
    const p = await askJSON([
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
      { type: 'text', text: 'זו תווית ערכים תזונתיים. החזר JSON בלבד, בלי טקסט נוסף ובלי סימני קוד: '
        + '{"name":"שם המוצר בעברית","kcal100":number,"protein100":number,"packageGrams":number|null,"servingGrams":number|null}. '
        + 'הערכים ל-100 גרם; אם התווית נותנת ערכים למנה בלבד, המר. אל תנחש ערך שאינו מופיע — החזר null.' }
    ], 1000);

    closeSheet();
    sheetFood(null, { name: p.name || '', unit: '100g', kcal: p.kcal100 ?? '', protein: p.protein100 ?? '',
                      qty: p.servingGrams || p.packageGrams || 100 });
    D.fromLabel = true; drawFood();
  } catch (e){
    const msg = (e && e.message) ? e.message : String(e);
    if (out) out.innerHTML = '<b style="color:var(--warn)">נכשל בשלב: ' + esc(stage) + '</b><br>' + esc(msg)
      + '<br><br>אפשר תמיד להזין ידנית — התווית מציגה את הערכים ל-100 גרם.';
  }
}

/* מציג את הערך הגולמי מהאחסון, בלי שום עיבוד — להשוואה מול הקונסולה. */
function showKey(){
  const raw = S.key || '';
  $('#lbl').innerHTML = 'המפתח כפי שנשמר (' + raw.length + ' תווים):'
    + '<br><span style="direction:ltr;display:inline-block;word-break:break-all;'
    + 'font-family:monospace;font-size:11px">' + esc(String(raw)) + '</span>';
}
function resetKey(){ S.keys[S.provider] = ''; save(KEYSLOT[S.provider], ''); sheetLabel(); }

/* --- יעדים --- */
function sheetTargets(){
  const st = S.settings;
  sheet('יעדים', `
    <label class="f"><span>יעד חלבון יומי (ג׳)</span>
      <input id="tp" type="number" inputmode="decimal" value="${st.proteinTarget || ''}"></label>
    <label class="f"><span>יעד קלוריות יומי</span>
      <input id="tk" type="number" inputmode="decimal" value="${st.kcalTarget || ''}"></label>
    <p class="xs mut">אפשר להשאיר ריק — אז הכלי רק סופר, בלי יעד.</p>
    <button class="solid full" style="margin-bottom:16px" onclick="saveTargets()">שמירה</button>
    <div class="sm mut" style="line-height:1.7">
      <p><b style="color:var(--ink)">חלבון.</b> מטא־אנליזה של Morton מצאה שמעל כ־1.6 ג׳ לק״ג ליום לא נמצאה
      תוספת רווח במסת גוף רזה מאימוני התנגדות; גבול העל של רווח הסמך היה 2.2. בגירעון קלורי כדאי לכוון
      לחלק העליון של הטווח, כדי לשמר מסה.</p>
      <p><b style="color:var(--ink)">קלוריות.</b> כל נוסחה היא הערכה עם סטייה של מאות קלוריות בין אנשים.
      אחרי שבועיים־שלושה, מגמת המשקל אומרת יותר מכל חישוב: הממוצע הנע לא זז והמטרה ירידה — הורד 200.
      יורד מהר מ־0.7 ק״ג בשבוע — הוסף 200.</p>
      <p><b style="color:var(--ink)">פיזור.</b> נוח יותר להגיע ליעד בשלוש־ארבע ארוחות של 30–40 גרם
      מאשר בארוחה אחת גדולה בערב.</p>
    </div>`);
}
function saveTargets(){
  S.settings = { proteinTarget: parseFloat($('#tp').value)||0, kcalTarget: parseFloat($('#tk').value)||0 };
  save('settings', S.settings); closeSheet(); render();
}

/* ============ אזהרה: דף ללא מקור אמיתי ============ */
function originOk(){
  try { localStorage.setItem('ft.probe','1'); localStorage.removeItem('ft.probe'); return true; }
  catch { return false; }
}

/* ============ ניווט ============ */
const TABS = [['day','היום'],['foods','מאכלים'],['weight','משקל'],['sum','סיכומים']];
function render(){
  const warn = originOk() ? '' :
    `<div class="card" style="border-color:var(--warn);background:#2A1A18;color:#F2C4BC">
      <b>הדף הזה רץ בתצוגה מוגבלת — שום דבר לא יישמר.</b>
      פתח את הכתובת בספארי (למשל מ-GitHub Pages) במקום לצפות בקובץ מתוך אפליקציה.
    </div>`;
  $('#app').innerHTML = warn + { day: viewDay, foods: viewFoods, weight: viewWeight, sum: viewSum }[S.tab]();
  $('#tabs').innerHTML = TABS.map(([id,l]) =>
    `<button class="${S.tab === id ? 'on' : ''}" onclick="S.tab='${id}';render()">${l}</button>`).join('');
}
render();
</script>
