<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טופס מסירת מקרה לרופא/ה</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-title" content="מרא״ה">

<meta property="og:type" content="website">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#0f1c2e; --ink-2:#3b4a63; --paper:#e8ecf3; --card:#ffffff;
  --line:#c9d2e0; --accent:#10627f; --alert:#b32218; --alert-soft:#fbe9e7;
  --warn:#8a5a00; --warn-soft:#fdf1dc; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2{font-family:'Heebo',system-ui,sans-serif;font-weight:900;letter-spacing:-.02em}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.topbar .t{font-family:'Heebo';font-weight:700;font-size:17px;flex:1}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 10px;font-family:'Assistant';font-size:14px;cursor:pointer}
.eyebrow{font-size:12.5px;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.hero{padding:26px 0 10px}
.hero h1{font-size:30px;margin:6px 0 8px;line-height:1.15}
.hero p{margin:0;color:var(--ink-2);font-size:16px}
.grid{display:grid;gap:10px;margin-top:18px}
.pick{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;cursor:pointer;font:inherit;color:inherit;border-inline-start:5px solid var(--accent)}
.pick:hover{border-color:var(--accent)}
.pick .n{font-family:'Heebo';font-weight:700;font-size:19px;display:block}
.pick .d{color:var(--ink-2);font-size:14.5px;margin-top:2px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card > h2{font-size:18px;margin:0 0 10px}
.sec-tag{font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.1em}
.field{margin:14px 0}
.lab{display:block;font-weight:600;margin-bottom:6px;font-size:16px}
.hint{font-size:13.5px;color:var(--ink-2);margin:-2px 0 6px}
input[type=text],input[type=number],input[type=time],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:inherit}
textarea{min-height:60px;resize:vertical}
.numwrap{display:flex;flex-direction:column;gap:7px}
.numwrap .quick{display:flex;flex-wrap:wrap;gap:6px}
.numwrap .quick .chip{padding:6px 11px;font-size:14.5px}
.numwrap .chip.nd{border-style:dashed;color:var(--ink-2)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.nonebtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;
 font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex:none}
.nonebtn[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.numwrap .chip.nd[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.numwrap.ndon .nm,.numwrap.ndon input[type=range]{opacity:.35;pointer-events:none}
.numwrap input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.rng{display:flex;align-items:center;gap:10px}
.rng .val{font-family:'Heebo';font-weight:700;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.nm{display:flex;align-items:center;gap:8px}
.nm input{max-width:130px}
.nm .u{color:var(--ink-2);font-size:15px}
.bp{display:flex;align-items:flex-end;gap:8px;direction:ltr;justify-content:flex-end}
.bp .col{display:flex;flex-direction:column;gap:3px;align-items:center}
.bp .col span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.bp input{max-width:96px;text-align:center}
.bp .sep{font-weight:700;color:var(--ink-2);padding-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.yn{display:flex;gap:7px}
.yn .chip{flex:1;text-align:center}
.yn .chip[data-v="כן"][aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.gate{background:var(--alert-soft);border:2px solid var(--alert);border-radius:var(--radius);padding:16px;margin:14px 0}
.gate h2{color:var(--alert);font-size:20px;margin:0 0 4px}
.gate p{margin:0 0 12px;font-size:15px;color:#5c1a14}
.rf{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;background:#fff;border:1px solid #e3b9b4;border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;cursor:pointer;color:inherit}
.rf[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff}
.rf .box{width:22px;height:22px;border:2px solid var(--alert);border-radius:6px;flex:none;margin-top:2px}
.rf[aria-pressed="true"] .box{background:#fff;border-color:#fff}
.act{background:var(--alert);color:#fff;border-radius:var(--radius);padding:18px;margin:14px 0}
.act h2{color:#fff;font-size:22px;margin:0 0 8px}
.act ol{margin:0;padding-inline-start:20px;font-size:17px;line-height:1.7}
.act .timer{font-family:'Heebo';font-weight:900;font-size:32px;background:rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;margin-top:14px;text-align:center;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-family:'Heebo';font-weight:700;font-size:17px;cursor:pointer;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.shot{background:#fff;border:1px solid var(--line);border-right:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:14px 0 4px;font-size:15px;line-height:1.5}
.btn.light{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5)}
.bar{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bar .inner{max-width:760px;margin:0 auto}
.bar .btn{margin:0}
.flags{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.flag{background:var(--warn-soft);border:1px solid #e0c281;color:var(--warn);border-radius:8px;padding:6px 11px;font-size:14.5px;font-weight:600}
.flag.red{background:var(--alert-soft);border-color:#e3b9b4;color:var(--alert)}
.stagehead{display:flex;align-items:center;gap:11px;margin:30px 2px 4px;padding-top:14px;border-top:2px solid var(--ink)}
.stagehead:first-child{margin-top:14px;padding-top:0;border-top:0}
.stagehead .l{flex:0 0 44px;width:44px;height:44px;border:2px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;background:var(--card)}
.stagehead .w h2{font-size:22px;margin:0;line-height:1.1}
.stagehead .w p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.moved{color:var(--accent);font-weight:700}
@media print{.topbar,.bar,.btn,.flags,.foot,.stagehead{display:none!important}
 body{background:#fff}.card{border:0;padding:0}}
pre.sbar{white-space:pre-wrap;font-family:'Assistant';font-size:15.5px;line-height:1.65;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
.none{color:var(--ink-2);font-size:15px}
.foot{color:var(--ink-2);font-size:13px;margin-top:22px;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="topbar"><div class="t" id="tb">טופס מסירת מקרה</div><button id="home" hidden>מסך פתיחה</button></div>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="inner"><button class="btn" id="build">יצירת מסירה</button></div></div>

<script>
/* F(id, label, kind, options, phrase, hint)
   kinds: sc=בחירה יחידה · ch=בחירה מרובה · yn=כן/לא · nm=מספר (options=יחידה) · bp=לחץ דם · tm=שעה · tx=טקסט
   phrase: תבנית עם $ ; ב-yn מערך [חיובי, שלילי] , null = לא נכנס לסיכום */
const F=(i,t,k,o,p,h,w)=>({i,t,k,o:o||null,p:p||null,h:h||null,w:w||null});
const VIS=f=>!f.w||f.w(A);
/* אפשרות שמשמעותה "אין ממצא" – משמשת גם לבחירה בלעדית וגם לכפתור הסעיף */
const NONE_RE=/^(ללא|לא היה|לא בוצע|לא ניתן|אין )/;
/* cond פועל בהיפוך: מסמנים מה שהתקיים, ואחת האפשרויות פותחת ב"ללא" אף שהיא ממצא חיובי */
const NO_NONE=['cond'];
const noneOpt=f=>(f.k==='ch'&&Array.isArray(f.o)&&NO_NONE.indexOf(f.i)<0)?(f.o.find(o=>NONE_RE.test(o))||null):null;
const secNoneable=s=>s.f.filter(VIS).some(noneOpt);
const SEC=(t,r,f,j)=>({t,r,f,j:j||'. '});
const ASK=SEC('הבקשה מהרופא/ה','r',[
  F('ask','הבקשה','sc',['לראות עכשיו','לראות היום','ייעוץ טלפוני','מרשם','דיווח בלבד'],'הבקשה: $'),
  F('worry','רמת החשש שלי','sc',['נמוכה','בינונית','גבוהה'],'רמת החשש: $'),
  F('free','משהו נוסף שחשוב לדעת','tx',null,'$')
]);
const GUT='תחושת הבטן שלי שזה דחוף';
const VIT=(...f)=>SEC('מדדים','a',f,', ');
/* ערכים מהירים וסליידרים לפי שדה. chips = לחיצה אחת, rng = [min,max,step] */
const NUMCFG={
 sat:{chips:[99,98,97,96,95,94,92,90],rng:[80,100,1]},
 o2b:{chips:[94,92,90,88,86],rng:[70,100,1]},
 o2a:{chips:[99,98,96,94,92],rng:[70,100,1]},
 temp:{chips:[36.5,37,37.5,38,38.5,39],rng:[35,41,0.1]},
 pulse:{chips:[60,70,80,90,100,110,120],rng:[35,180,1]},
 psup:{chips:[60,70,80,90,100],rng:[35,180,1]},
 pstand:{chips:[70,80,90,100,110],rng:[35,180,1]},
 rr:{chips:[12,14,16,18,20,24,28],rng:[6,45,1]},
 flow:{chips:[1,2,3,4,5,6]},
 glu:{chips:[70,100,140,200,300],rng:[30,500,1]},
 age:{rng:[18,105,1]}
};

const MODULES=[
{
 id:'chest', name:'כאבים בחזה', desc:'כאב בחזה בכל צורה, כולל כאב שחלף',
 gate:['הכאב עכשיו והמטופל נראה לא טוב – הזעה, חיוורון, הקאות או קוצר נשימה',
       'כאב פתאומי וחזק, קורע, שמקרין לגב',
       'התעלף או כמעט התעלף עם הכאב',
       'סטורציה מתחת ל-94%, סיסטולי מתחת ל-100, דופק מתחת ל-50 או מעל 120',
       GUT],
 act:['להפסיק את השאלון.','לקרוא לרופא/ה עכשיו.','להשכיב את המטופל/ת ולא להשאיר לבד.','אק״ג ומדדים חוזרים.'],
 sections:[
  SEC('מאפייני הכאב','s',[
   F('onset','מתי התחיל','sc',['פחות משעה','1-6 שעות','6-24 שעות','1-3 ימים','מעל 3 ימים'],'הכאב התחיל לפני $'),
   F('now','הכאב קיים עכשיו','yn',null,['הכאב קיים גם עכשיו','הכאב חלף']),
   F('dur','משך ההתקף','sc',['שניות','עד 5 דקות','5-20 דקות','20-60 דקות','מעל שעה','מתמשך'],'משך ההתקף $'),
   F('rec','ראשון או חוזר','sc',['אירוע ראשון','אירוע חוזר'],'$'),
   F('trend','מגמה','sc',['מחמיר','יציב','משתפר'],'מגמה: $'),
   F('char','אופי','ch',['לחץ','צריבה','דקירה','אחר'],'אופי הכאב: $'),
   F('site','מיקום','ch',['מרכזי','שמאל','ימין','אפיגסטרי'],'מיקום: $'),
   F('rad','הקרנה','ch',['יד','לסת','גב','ללא הקרנה'],'הקרנה: $')]),
  SEC('מה משפיע על הכאב','s',[
   F('trig','גורמים','ch',['מופיע במאמץ','מופיע במנוחה','מחמיר בשכיבה','משתפר בהישענות קדימה','מחמיר בנשימה עמוקה','מופיע בלחיצה על בית החזה','קשור לארוחה'],'$'),
   F('rel','מה הקל','ch',['מנוחה','ניטרט','סותר חומצה','שום דבר לא הקל'],'הקלה: $')]),
  SEC('סימנים נלווים','a',[
   F('assoc','סימנים','ch',['קוצר נשימה','הזעה','בחילה','דפיקות לב','שיעול','חום','ליחה','בצקת ברגל אחת','סחרחורת','ללא סימנים נלווים'],'מלווה ב$|ללא סימנים נלווים')]),
  VIT(F('bp','לחץ דם','bp',null,'ל״ד $'),
      F('pulse','דופק','nm','לדקה','דופק $'),
      F('rhythm','סדירות','sc',['סדיר','לא סדיר'],'$'),
      F('sat','סטורציה','nm','%','סטורציה $%'),
      F('temp','חום','nm','מעלות','חום $')),
  SEC('רקע וגורמי סיכון','b',[
   F('card','לב וכלי דם','ch',['מחלת לב ידועה, צנתור או מעקפים','סוכרת','יתר לחץ דם','שומנים בדם','עישון','אירוע לב מוקדם במשפחה','ללא'],'גורמי סיכון: $'),
   F('pe','הקשר לתסחיף','ch',['ניתוח לאחרונה','שכיבה ממושכת','טיסה ארוכה','ממאירות פעילה','הורמונים או היריון','ללא'],'הקשר לתסחיף: $'),
   F('meds','תרופות רלוונטיות','ch',['אספירין או נוגד טסיות','נוגד קרישה','סטטין','חוסם בטא','ניטרטים','ללא'],'תרופות: $')]),
  SEC('מה כבר נעשה','r',[
   F('ecg','בוצע אק״ג','yn',null,['בוצע אק״ג','אק״ג לא בוצע']),
   F('ecgres','ממצא באק״ג','sc',['תקין','שינויים','לא ברור','טרם נקרא'],'הממצא $'),
   F('ecgby','מי קרא','sc',['אחות','פוענח מרחוק ע״י קרדיולוג','טרם נקרא'],'נקרא על ידי $'),
   F('prev','בירור קודם על אותו כאב','ch',['לא היה','מבחן מאמץ','צנתור','ביקור במיון'],'בירור קודם: $')]),
  ASK],
 flags:s=>{const f=[];
  if(s.has('trig','מופיע במאמץ'))f.push(['מופיע במאמץ',1]);
  const pos=['מחמיר בנשימה עמוקה','מחמיר בשכיבה','משתפר בהישענות קדימה'].filter(x=>s.has('trig',x));
  if(pos.length)f.push([heList(pos),0]);
  if(s.has('trig','מופיע בלחיצה על בית החזה'))f.push(['רגיש למישוש – אינו שולל תסמונת כלילית',0]);
  if(s.anyBut('pe','ללא'))f.push([heList((s.a('pe')||[]).filter(x=>x.indexOf('ללא')!==0)),1]);
  if(s.has('card','מחלת לב ידועה, צנתור או מעקפים'))f.push(['מחלת לב ידועה',1]);
  if(s.v('ecg')!=='כן')f.push(['לא בוצע אק״ג',1]);
  if(s.v('rhythm')==='לא סדיר')f.push(['דופק לא סדיר',1]);
  return f;}
},
{
 id:'bp', name:'יתר לחץ דם', desc:'מדידת לחץ דם גבוהה בעמדת האחות',
 gate:['כאב בחזה, קוצר נשימה קשה או קוצר נשימה בשכיבה',
       'ממצא נוירולוגי חדש – חולשה, עיוות פנים, קושי בדיבור, ירידה בראייה, כאב ראש חד וחזק, בלבול',
       'היריון או עד 6 שבועות מהלידה עם לחץ דם 140/90 ומעלה',
       'סיסטולי 220 ומעלה או דיאסטולי 120 ומעלה במדידה חוזרת',
       GUT],
 act:['להפסיק את השאלון.','לקרוא לרופא/ה עכשיו.','להשאיר את המטופל/ת בישיבה או שכיבה ולמדוד שוב בעוד 5 דקות.'],
 sections:[
  SEC('תנאי המדידה','a',[
   F('cond','לסמן כל מה שהתקיים','ch',['מנוחה 5 דקות','גב וזרוע נתמכים','רגליים על הרצפה','לא דיבר בזמן המדידה','שרוול מתאים להיקף הזרוע','שרוול על יד חשופה','שלפוחית ריקה','ללא קפה, סיגריה או מאמץ בחצי שעה'],'-','הסיכום יציג רק את מה שלא התקיים'),
   F('arm','באיזו יד','sc',['ימין','שמאל'],'נמדד ביד $')],', '),
  VIT(F('bp1','מדידה ראשונה','bp',null,'מדידה ראשונה $'),
      F('t1','שעת המדידה','tm',null,'בשעה $'),
      F('bp2','מדידה חוזרת אחרי 5 דקות','bp',null,'מדידה חוזרת $'),
      F('bp3','מדידה שלישית','bp',null,'מדידה שלישית $'),
      F('other','מדידה ביד השנייה','bp',null,'ביד השנייה $'),
      F('pulse','דופק','nm','לדקה','דופק $'),
      F('rhythm','סדירות','sc',['סדיר','לא סדיר'],'$')),
  SEC('הקשר','s',[
   F('why','למה נמדד לחץ הדם','sc',['שגרה','תלונה','מעקב','לפני פרוצדורה','בקשת המטופל'],'לחץ הדם נמדד ב$'),

const BE=t=>(/^[A-Za-z0-9]/.test(t)?'ב-':'ב')+t;
function heList(a){a=a.filter(Boolean);if(!a.length)return '';if(a.length===1)return a[0];return a.slice(0,-1).join(', ')+' ו'+a[a.length-1]}
const LST=id=>heList((A[id]||[]).filter(x=>!SKIP.includes(x)&&x.indexOf('ללא')!==0));
const C=(...x)=>x.filter(Boolean).join(', ');
const P=(...x)=>{const t=x.filter(Boolean).map(s=>s.trim().replace(/[.,]$/,''));return t.length?t.join('. ')+'.':''};
const BP=id=>{const v=V(id);return /^\d+\/\d+$/.test(v)?v:''};
function vitals(pairs){return C.apply(null,pairs.map(([lab,val])=>(val&&String(val).indexOf('לא נמדד')<0)?lab+' '+val:''))}

}

/* ---------- prose summary ---------- */
const SKIP=['לא ידוע','לא רלוונטי'];
function clause(f){
 if(['age','sex','where'].includes(f.i))return null;
 if(f.p==='-')return null;          // כבר בשורת הפתיחה
 const v=A[f.i];
 if(v==null||v===''||(Array.isArray(v)&&!v.length))return null;
 if(f.k==='yn'){
   const p=Array.isArray(f.p)?f.p:[f.p,null];
   if(v==='כן')return p[0]||null;
   if(v==='לא')return p[1]||null;
   return null;
 }
 if(!Array.isArray(v)&&SKIP.includes(v))return null;
 if(f.k==='bp'&&/^\/?$|^\d*\/$|^\/\d*$/.test(v))return null;
 let tpl=f.p, zero=null;
 if(tpl&&tpl.indexOf('|')>-1){const parts=tpl.split('|');tpl=parts[0];zero=parts[1]}
 const items=Array.isArray(v)?v.filter(x=>!SKIP.includes(x)):[v];
 if(!items.length)return null;
 if(zero&&items.every(x=>x.indexOf('ללא')===0))return zero;
 const txt=items.join(', ');
 return tpl?tpl.replace('$',txt):f.t+': '+txt;
}
function para(role){
 if(NARR[M.id]&&NARR[M.id][role]){try{return NARR[M.id][role]()||''}catch(e){console.error(e)}}
 const out=[];
 [COMMON].concat(M.sections).filter(s=>s.r===role).forEach(s=>{
   const cl=s.f.filter(VIS).map(clause).filter(Boolean);
   if(cl.length)out.push(cl.join(s.j));
 });
 let t=out.join('. ').replace(/\.\.+/g,'.').replace(/, \./g,'.');
 return t?(/[.!?]$/.test(t)?t:t+'.'):'';
}
function opener(){
 const age=A.age, sex=A.sex;
 let who = sex==='אישה' ? ('אישה'+(age?' בת '+age:'')) : sex==='גבר' ? ('גבר'+(age?' בן '+age:'')) : (age?'מטופל/ת בגיל '+age:'מטופל/ת');
 const loc = A.where ? (sex==='אישה'?' נמצאת ':' נמצא ')+A.where+'.' : '';
 return who+', '+M.name+'.'+loc;
}
function bpTechMiss(){
 if(M.id!=='bp')return null;
 const cond=M.sections[0].f[0].o;
 const miss=cond.filter(c=>!S.has('cond',c));
 return miss.length?'תנאי מדידה שלא התקיימו: '+miss.join(', ')+'.':'תנאי המדידה התקיימו במלואם.';
}
function buildText(f){
 const red=f.filter(x=>x[1]===2).map(x=>x[0]);
 const stamp=new Date().toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 const head=askHead();
 const parts=[`מסירה — ${M.name}, ${stamp}`];
 parts.push(opener()+(head?' '+head+'.':''));
 if(gate.length)parts.push('הופעל דגל אדום: '+gate.map(i=>M.gate[i]).join('; ')+'.');
 if(red.length)parts.push('לתשומת לבך: '+red.join('; ')+'.');
 parts.push('');
 const sit=para('s'); if(sit)parts.push('מצב: '+sit);
 const b=para('b'); if(b)parts.push('רקע: '+b);
 let a=para('a'); const nm=notMeasured();
 if(nm)a=(a?a.replace(/\.$/,'')+'. ':'')+nm+'.';
 if(a)parts.push('אומדן: '+a);
 const r=para('r'); if(r)parts.push('המלצה: '+r);
 return parts.join('\n').replace(/ +/g,' ').replace(/\s+\./g,'.');
}

function bpSanity(){
 const out=[];
 [COMMON].concat(M.sections).forEach(sec=>sec.f.forEach(fl=>{
   if(fl.k!=='bp')return;
   const m=/^(\d+)\/(\d+)$/.exec(A[fl.i]||'');
   if(m&&+m[1]<=+m[2])out.push(['לבדוק שוב את '+fl.t+' – הערך הסיסטולי נמוך מהדיאסטולי',2]);
 }));
 return out;
}
function summary(){
 const f=M.flags(S).concat(bpSanity()), txt=buildText(f);
 const chips=f.filter(x=>x[1]<2);   // הדגלים האדומים כבר מופיעים בטקסט
 bar.hidden=true;
 app.innerHTML=`
  <div class="card">
    <div class="sec-tag">דגלים</div>
    <h2>מה בולט במסירה הזו</h2>
    ${f.length?`<div class="flags">${f.map(([t,lvl])=>`<span class="flag ${lvl===2?'red':''}">${esc(t)}</span>`).join('')}</div>`:`<p class="none">לא סומנו דגלים. היעדר דגל אינו קביעה שהממצא נשלל.</p>`}
    <p class="none">אין כאן ניקוד ואין דירוג חומרה. הפרשנות היא של הרופא.</p>
  </div>
  <div class="card">
    <div class="sec-tag">מסירה</div>
    <h2>לקריאה או להעתקה לתיק</h2>
    <pre class="sbar" id="sbar">${esc(txt)}</pre>
    <div class="field"><span class="lab">שליחה בוואטסאפ לרופא/ה</span>
      <div class="chips" id="docs">${DOCTORS.map((d,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="false">${esc(d.n)}</button>`).join('')}</div></div>
    <button class="btn" id="wa">בחירת רופא/ה לשליחה</button>
    <button class="btn ghost" id="copy">העתקה לתיק</button>
    <button class="btn ghost" id="share">שליחה בדרך אחרת</button>
    <button class="btn ghost" id="back">חזרה לשאלון</button>
    <button class="btn ghost" id="new">מקרה חדש</button>
  </div>`;
 void chips;
 document.getElementById('copy').onclick=async e=>{
   try{await navigator.clipboard.writeText(txt);e.target.textContent='הועתק'}
   catch{const r=document.createRange();r.selectNode(document.getElementById('sbar'));
     getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent='לסמן ולהעתיק ידנית'}
 };
 toDoc=null;
 const waBtn=document.getElementById('wa');
 document.getElementById('docs').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
   const on=c.getAttribute('aria-pressed')==='true';
   document.getElementById('docs').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
   if(on){toDoc=null;waBtn.textContent='בחירת רופא/ה לשליחה'}
   else{c.setAttribute('aria-pressed','true');toDoc=DOCTORS[+c.dataset.i];waBtn.textContent='שליחה בוואטסאפ ל'+toDoc.n}
 });
 waBtn.onclick=e=>{
   if(!toDoc){e.target.textContent='קודם לבחור רופא/ה מהרשימה';return}
   if(!toDoc.p){e.target.textContent='מספר של '+toDoc.n+' טרם הוגדר – אפשר "שליחה בדרך אחרת"';return}
   window.open('https://wa.me/'+toDoc.p+'?text='+encodeURIComponent('ל'+toDoc.n+' —\n\n'+txt),'_blank');
 };
 document.getElementById('share').onclick=async e=>{
   try{
     if(navigator.share){await navigator.share({title:'מסירה — '+M.name,text:txt});return}
     window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
   }catch(err){ if(err&&err.name==='AbortError')return; e.target.textContent='השיתוף נכשל — אפשר להעתיק' }
 };
 document.getElementById('back').onclick=()=>renderForm();
 document.getElementById('new').onclick=()=>home();
}

document.getElementById('build').onclick=summary;
homeBtn.onclick=home;
home();
</script>
</body>
</html>
