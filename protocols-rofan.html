<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פרוטוקולים לרפואן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: single column work surface — protocol tabs, search, one drug "label" card at a time */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18232a; --muted:#5b6a72; --line:#d7dfdd;
  --accent:#1d4f91; --accent-soft:#e3ebf6;
  --ok:#1f7a45; --ok-bg:#e2f3e8; --warn:#8a5a00; --warn-bg:#fbf0d6; --bad:#a3262a; --bad-bg:#f9e1e1;
  --f-display:"Frank Ruhl Libre", "David", Georgia, serif;
  --f-body:"Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --surface:#1a2228; --ink:#e7ecee; --muted:#9aa8ae; --line:#2c373e;
  --accent:#8db4ec; --accent-soft:#1f2d40;
  --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f0c46a; --warn-bg:#33280f; --bad:#f19a9c; --bad-bg:#3a1b1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --surface:#1a2228; --ink:#e7ecee; --muted:#9aa8ae; --line:#2c373e;
  --accent:#8db4ec; --accent-soft:#1f2d40;
  --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f0c46a; --warn-bg:#33280f; --bad:#f19a9c; --bad-bg:#3a1b1c; color-scheme:dark}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
header{display:grid;gap:4px}
h1{font-family:var(--f-display);font-size:1.9rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab:focus-visible,input:focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.view{background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;font:inherit;color:var(--muted);cursor:pointer}
.view[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.search{display:grid;gap:8px}
.search label{font-weight:600}
#q{font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.hits{display:flex;flex-wrap:wrap;gap:6px}
.hit{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;padding:4px 10px;border-radius:8px;cursor:pointer}
.hit[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.empty{color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{padding:16px 18px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
.card-h h2{font-family:var(--f-display);font-size:1.5rem;margin:0;line-height:1.2}
.gen{direction:ltr;text-align:right;color:var(--muted);font-size:.95rem}
.cls{color:var(--muted);font-size:.9rem}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;font-weight:600}
.pill{padding:3px 12px;border-radius:999px;font-size:.95rem;white-space:nowrap}
.v-yes{background:var(--ok-bg);color:var(--ok)} .v-cond{background:var(--warn-bg);color:var(--warn)} .v-no{background:var(--bad-bg);color:var(--bad)}
.verdict .why{font-weight:400}
.sec{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:8px}
.sec h3{margin:0;font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.checks{list-style:none;padding:0}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.checks .det{color:var(--muted);font-size:.92rem}
.act{color:var(--bad);font-weight:600}
.thr li{font-variant-numeric:tabular-nums}
.brand-list{display:flex;flex-wrap:wrap;gap:6px}
.brand{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.9rem}
.brand small{color:var(--warn)}
.src{color:var(--muted);font-size:.85rem}
.doc{background:var(--accent-soft)}
.doc-row{display:grid;gap:4px}
.doc-row label{font-size:.9rem;font-weight:600}
.doc select,.doc input,.doctext{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.doctext{resize:vertical;line-height:1.6}
.doc-actions{display:flex;gap:10px;align-items:center}
.copy{font:inherit;font-weight:600;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
.copy:focus-visible,.doc select:focus-visible,.doc input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.warnmsg{margin:0;color:var(--bad);font-weight:600;font-size:.92rem}
.copied{color:var(--ok);font-size:.9rem}
.rules{background:var(--accent-soft);border-radius:12px;padding:14px 18px;display:grid;gap:6px}
.rules h3{margin:0;font-size:1rem}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{text-align:right;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.grp td{background:var(--bg);font-weight:700}
.kind{white-space:nowrap;font-size:.85rem;color:var(--accent)}
footer{color:var(--muted);font-size:.85rem;display:grid;gap:4px}
@media (prefers-reduced-motion: no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>פרוטוקולים לרפואן</h1>
    <p class="sub">חידוש מרשמים כרוניים לפי פרוטוקול. כל חריגה עוברת לרופא. · <a href="doctors.html" style="color:var(--accent)">כל הכלים לרופאים</a></p>
  </header>

  <div class="tabs" role="tablist" aria-label="פרוטוקול">
    <button class="tab" role="tab" aria-selected="true" id="p-htn">יתר לחץ דם</button>
  </div>

  <div class="views" role="tablist" aria-label="תצוגה">
    <button class="view" role="tab" aria-selected="true" data-v="drug" id="v-drug">חיפוש תרופה</button>
    <button class="view" role="tab" aria-selected="false" data-v="common" id="v-common">בדיקות לכל חידוש</button>
    <button class="view" role="tab" aria-selected="false" data-v="dec" id="v-dec">החלטות ומקורות</button>
  </div>

  <section id="drug" class="wrap">
    <div class="search">
      <label for="q">שם תרופה (מסחרי או גנרי, עברית או אנגלית)</label>
      <input id="q" type="search" autocomplete="off" placeholder="לדוגמה: לוטן, Norvasc, ramipril" value="לוטן">
      <div class="hits" id="hits"></div>
    </div>
    <div id="detail"></div>
  </section>

  <section id="common" class="wrap" hidden></section>
  <section id="dec" class="wrap" hidden></section>

  <footer>
    <span id="foot-src"></span>
    <span>כלי עזר לפי פרוטוקול מאושר. לא שומר נתונים ולא מזהה מטופלים.</span>
  </footer>
</div>

}

let current = null, lastQ = null;
const hitsEl = document.getElementById("hits"), detailEl = document.getElementById("detail"), qEl = document.getElementById("q");

function renderHits(){
  const res = search(qEl.value);
  if(!qEl.value.trim()){ hitsEl.innerHTML = ""; detailEl.innerHTML = '<p class="empty">הקלידו שם תרופה כדי לראות את דרישות החידוש.</p>'; return; }
  if(!res.length){ hitsEl.innerHTML = ""; detailEl.innerHTML = '<p class="empty">לא נמצאה תרופה בשם הזה בפרוטוקול יתר לחץ דם. תרופה שלא מופיעה כאן עוברת לרופא.</p>'; return; }
  if(qEl.value !== lastQ || !res.includes(current)) current = res[0];
  lastQ = qEl.value;
  hitsEl.innerHTML = res.length > 1 ? res.slice(0,12).map(i => {
    const d = DATA.drugs[i]; const b = matchedBrand(d, qEl.value);
    return `<button class="hit" aria-pressed="${i===current}" data-i="${i}">${esc(b ? b.he : d.he)} · ${esc(d.generic)}</button>`;
  }).join("") : "";
  renderDetail(current);
}

function renderDetail(i){
  const d = DATA.drugs[i];
  const b = matchedBrand(d, qEl.value);
  const [cls, label] = SUIT[d.suit];
  const checks = d.checks.map(c => `<li><label><input type="checkbox" id="c-${i}-${c.k}" data-k="${c.k}"${c.opt?' data-opt="1"':''}><span><b>${esc(c.label)}</b>${c.opt?' <span class="det">(רק אם רלוונטי)</span>':''}<br><span class="det">${esc(c.det)}</span></span></label></li>`).join("");
  detailEl.innerHTML = `
  <article class="card">
    <div class="card-h">
      <h2>${esc(b ? b.he + " · " + b.en : d.he)}</h2>
      <div class="gen">${esc(d.generic)}</div>
      <div class="cls">${esc(d.cls)}</div>
    </div>
    <div class="verdict ${cls}"><span class="pill ${cls}">${label}</span><span class="why">${esc(d.why)}</span></div>
    ${d.suit === "לא" ? `<div class="sec"><p style="margin:0">התרופה לא בפרוטוקול הרפואן. להעביר את הבקשה לרופא המטפל.</p></div>` : `
    <div class="sec"><h3>לבדוק לפני החידוש</h3><ul class="checks">${checks}</ul></div>`}
    ${d.suit === "לא" ? "" : `
    <div class="sec doc"><h3>טקסט לתיעוד</h3>
      <div class="doc-row">
        <label for="o-${i}">תוצאה</label>
        <select id="o-${i}" class="outcome">
          <option value="3">חודש למשך 3 חודשים</option>
          <option value="1">חודש לחודש אחד (חסרה מדידה או בדיקות, הופנה להשלים)</option>
          <option value="0">לא חודש, הועבר לרופא</option>
        </select>
      </div>
      <div class="doc-row">
        <label for="n-${i}">הערה (לא חובה)</label>
        <input id="n-${i}" class="note" type="text" placeholder="לדוגמה: ל&quot;ד ביתי 126/78, K 4.6">
      </div>
      <p class="warnmsg" role="status" hidden>יש בדיקות שלא סומנו. לפי הפרוטוקול לא מחדשים לפני שכולן נבדקו ותקינות.</p>
      <textarea id="t-${i}" class="doctext" readonly rows="16" aria-label="טקסט לתיעוד להעתקה"></textarea>
      <div class="doc-actions"><button type="button" class="copy" data-t="t-${i}">העתקה</button><span class="copied" role="status"></span></div>
    </div>`}
    <div class="sec thr"><h3>ערכים שמחזירים לרופא</h3><ul>${d.thr.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>תלונות שמחזירות לרופא (החלפה או הפסקה)</h3><ul>${d.comp.map(([c,a])=>`<li>${esc(c)} <span class="act">← ${esc(a)}</span></li>`).join("")}</ul></div>
    <div class="sec"><h3>מוציא מהפרוטוקול</h3><ul>${d.excl.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>שמות מסחריים</h3><div class="brand-list">${d.brands.map(x=>`<span class="brand">${esc(x.he)} · ${esc(x.en)}${x.note?` <small>(${esc(x.note)})</small>`:""}</span>`).join("")}</div>
      <div class="src">מקור: ${esc(DATA.guide)}, ${esc(d.src)}</div></div>
  </article>
  <div class="rules"><h3>כללי חידוש</h3><ul>${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  buildDoc();
}

function buildDoc(){
  const ta = detailEl.querySelector(".doctext"); if(!ta) return;
  const d = DATA.drugs[current]; const b = matchedBrand(d, qEl.value);
  const name = (b ? b.he + " (" + d.generic + ")" : d.he + " (" + d.generic + ")");
  const byK = Object.fromEntries(d.checks.map(c => [c.k, c]));
  const boxes = [...detailEl.querySelectorAll(".checks input")];
  const done = boxes.filter(x => x.checked).map(x => byK[x.dataset.k]);
  const notDone = boxes.filter(x => !x.checked && !x.dataset.opt).map(x => byK[x.dataset.k]);
  const out = detailEl.querySelector(".outcome").value;
  const note = detailEl.querySelector(".note").value.trim();
  const SOFT = ["bp","target","annual"];
  const missing = notDone.filter(c => c.k === "bp" || c.k === "annual").map(c => c.k === "bp" ? 'מדידת ל"ד' : "בדיקות שנתיות");
  const hard = notDone.filter(c => !SOFT.includes(c.k));
  const outTxt = {"3":"תוצאה: המרשם חודש ל-3 חודשים.","1":"תוצאה: המרשם חודש לחודש אחד בלבד; הופנה/תה להשלים " + (missing.length ? missing.join(" ו") : "מדידה/בדיקות") + ". החידוש הבא רק לאחר ההשלמה.","0":"תוצאה: המרשם לא חודש; הבקשה הועברה לרופא/ה."}[out];
  const lines = ["חידוש מרשם כרוני ע\"י רפואן לפי פרוטוקול יתר לחץ דם (" + DATA.version + ").",
                 "תרופה: " + name + ", " + d.cls + ".", "", "נבדק לפני החידוש:"];
  done.forEach(c => lines.push("✓ " + c.doc));
  if(notDone.length){ lines.push("", "לא נבדק או לא תקין:"); notDone.forEach(c => lines.push("✗ " + c.label)); }
  if(note){ lines.push("", "הערה: " + note); }
  lines.push("", outTxt);
  ta.value = lines.join("\n");
  const w = detailEl.querySelector(".warnmsg");
  if(out === "3" && notDone.length){ w.hidden = false; w.textContent = "יש בדיקות שלא סומנו. חידוש ל-3 חודשים רק כשכולן נבדקו ותקינות. חסרה רק מדידה או בדיקות שנתיות? בחרו חידוש לחודש אחד."; }
  else if(out === "1" && hard.length){ w.hidden = false; w.textContent = "לא סומן: " + hard.map(c=>c.label).join(", ") + ". חידוש לחודש אחד מותר רק כשחסרה מדידה או בדיקות שנתיות."; }
  else w.hidden = true;
}
detailEl.addEventListener("change", buildDoc);
detailEl.addEventListener("input", e => { if(e.target.classList.contains("note")) buildDoc(); });
detailEl.addEventListener("click", async e => {
  const btn = e.target.closest(".copy"); if(!btn) return;
  const ta = document.getElementById(btn.dataset.t); const msg = btn.nextElementSibling;
  try { await navigator.clipboard.writeText(ta.value); msg.textContent = "הועתק"; }
  catch(_) { ta.focus(); ta.select(); msg.textContent = "הטקסט מסומן, העתיקו ידנית (Ctrl+C)"; }
  setTimeout(() => msg.textContent = "", 2500);
});

hitsEl.addEventListener("click", e => { const t = e.target.closest(".hit"); if(!t) return; current = +t.dataset.i; renderHits(); });
qEl.addEventListener("input", renderHits);

function renderCommon(){
  let html = "", cur = null;
  for(const [sec, topic, check, rule, fail, src] of DATA.common){
    if(sec !== cur){ html += `<tr class="grp"><td colspan="4">${esc(sec)}</td></tr>`; cur = sec; }
    html += `<tr><td><b>${esc(topic)}</b><br><span class="src">${esc(check)}</span></td><td>${esc(rule)}</td><td class="act">${esc(fail)}</td><td class="src">${esc(src)}</td></tr>`;
  }
  document.getElementById("common").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>מה בודקים</th><th>קריטריון</th><th>אם לא מתקיים</th><th>מקור</th></tr></thead><tbody>${html}</tbody></table></div>
  <div class="rules"><h3>כללי חידוש</h3><ul>${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}
function renderDec(){
  const rows = DATA.decisions.map(d => `<tr><td>${esc(d[1])}</td><td>${esc(d[2])}</td><td><b>${esc(d[3])}</b></td><td class="kind">${esc(d[4])}</td></tr>`).join("");
  document.getElementById("dec").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>נושא</th><th>מה ההנחיה אומרת</th><th>ההחלטה בפרוטוקול</th><th>סוג</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="src">"הכרעה" = פרקים בהנחיה סותרים ונבחרה אפשרות אחת. "החלטה מקומית" = ההנחיה לא נותנת ערך. מקור: ${esc(DATA.guide)}.</p>`;
}

document.querySelectorAll(".view").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".view").forEach(b => b.setAttribute("aria-selected", b === btn));
  ["drug","common","dec"].forEach(id => document.getElementById(id).hidden = id !== btn.dataset.v);
}));

document.getElementById("foot-src").textContent = DATA.guide + " · " + DATA.version;
renderCommon(); renderDec(); renderHits();
</script>

</body>
</html>
